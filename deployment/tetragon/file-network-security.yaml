# ABIP P0 TracingPolicy:文件 / 网络 / 权限。
# 注意:Tetragon 默认只有进程生命周期事件,文件/网络/权限必须像这样显式配置 Hook。
# 生产环境应加 selectors 限定范围,否则事件量巨大。
# 按 k8s 过滤用 matchWorkloads.podSelector(matchNamespaces 是 Linux namespace,不是 k8s!):
# podSelector 匹配的是 **pod labels**,且标签需在 pod 创建时就存在(运行中补标签不生效):
#   selectors:
#     - matchWorkloads:
#         podSelector:
#           matchLabels: {abip.io/observe: "true"}
# 已在 Tetragon v1.8.0 / k8s v1.37 真实集群验证(2026-11-23)。
# 另:真实事件的 function_name 带架构前缀(__x64_sys_openat),Collector 已兼容。
# 实测(Tetragon v1.8.0 / kernel 6.12):syscall:true 的 hook 与 matchWorkloads selector
# 组合时不产生事件,必须用内核函数 + syscall:false(如 do_sys_openat2 代替 sys_openat)。
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: abip-file-network-security
spec:
  kprobes:
    - call: "do_sys_openat2"
      syscall: false
      args:
        - index: 1
          type: "string"
    # shortcut: file_write 暂不采集(sys_write 的 arg 是缓冲区不是路径,需要 fd→path 解析),
    # POC 用 file_open 覆盖文件行为;升级时加 fd 解析或改用 security_file_permission hook。
    - call: "tcp_connect"
      syscall: false
      args:
        - index: 0
          type: "sock"
    # shortcut: commit_creds 在每次 execve 时都会触发(内核正常行为,非异常),
    # P3 风险触发需降权;sys_setuid(syscall:true)与 selector 不兼容,由 commit_creds 覆盖。
    - call: "commit_creds"
      syscall: false